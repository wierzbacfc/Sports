name: Daily Sports Intel WhatsApp Reporter

on:
  schedule:
    # Uruchamianie codziennie o 6:00 UTC (8:00 czasu polskiego letniego CEST / 7:00 zimowego CET)
    - cron: '0 6 * * *'
  workflow_dispatch: # Przycisk ręcznego uruchomienia w interfejsie GitHub Actions

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Google Chrome
        run: google-chrome --version

      - name: Check Secrets Configuration
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "✅ GEMINI_API_KEY jest skonfigurowany w GitHub Secrets."
          else
            echo "⚠️ OSTRZEŻENIE: GEMINI_API_KEY NIE został znaleziony w GitHub Secrets! Uruchomiony zostanie wbudowany inteligentny formater."
          fi

      - name: Run Daily Sports Report & Send WhatsApp
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node daily_report.js
